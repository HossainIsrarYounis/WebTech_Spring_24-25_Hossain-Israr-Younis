<!DOCTYPE html>
<html lang="en">
<head>
    <title>Evan's Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>Form</h2>
    <form id="registrationForm">
        <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </div>
        <div class="form-row">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age">
        </div>
        <div class="form-row">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-row">
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <span for="male">Male</span>
            <input type="radio" id="female" name="gender" value="Female">
            <span for="female">Female</span>
            <input type="radio" id="other" name="gender" value="Other">
            <span for="other">Other</span>
        </div>
        <div class="form-row">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </div>
        <div class="form-row">
            <label for="language">Favorite Programming Language:</label>
            <select id="language" name="language">
                <option value="BrainFuck">BrainFuck</option>
                <option value="Rust">Rust</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
                <option value="C#">C#</option>
                <option value="C++">C++</option>
            </select>
        </div>
        <div class="form-row">
            <button type="submit">Submit</button>
        </div>
    </form>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(event) {
        let name = document.getElementById('name').value;
        let age = document.getElementById('age').value;
        let email = document.getElementById('email').value;
        let gender = document.querySelector('input[name="gender"]:checked');
        let password = document.getElementById('password').value;
        let language = document.getElementById('language').value;
        let isValid = true;
        let errorDiv = document.createElement('div');
        errorDiv.className = 'error';

        if (!name.match(/^[A-Za-z\s]+$/)) {
            isValid = false;
            errorDiv.textContent = "Invalid name format.";
            document.getElementById('name').parentNode.appendChild(errorDiv);
        }
        if (!age.match(/^\d+$/) || age < 18 || age > 100) {
            isValid = false;
            errorDiv.textContent = "Invalid age.";
            document.getElementById('age').parentNode.appendChild(errorDiv);
        }
        if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
            isValid = false;
            errorDiv.textContent = "Invalid email format.";
            document.getElementById('email').parentNode.appendChild(errorDiv);
        }
        if (!gender) {
            isValid = false;
            errorDiv.textContent = "Gender not selected.";
            document.querySelector('input[name="gender"]').parentNode.appendChild(errorDiv);
        }
        if (!password.match(/^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/)) {
            isValid = false;
            errorDiv.textContent = "Password must contain at least one number, one uppercase letter, one lowercase letter, and be at least 8 characters long.";
            document.getElementById('password').parentNode.appendChild(errorDiv);
        }

        if (!isValid) {
            event.preventDefault();
        }
    });
</script>

</body>
</html>
